[project]
name = "ledgerlens"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "jinja2", "pillow", "numpy", "httpx"]

[project.optional-dependencies]
worker = ["runpod"]
app = ["fastapi", "uvicorn", "python-multipart", "qrcode[pil]"]

[dependency-groups]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ledgerlens"]

[tool.ruff]
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
