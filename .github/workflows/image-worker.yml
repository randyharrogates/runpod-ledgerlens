# Builds the FLUX image worker and publishes it to GHCR, so the image endpoint
# can run a prebuilt image when Runpod's GitHub builder is unavailable.
name: image-worker

on:
  workflow_dispatch:
  push:
    branches: [deploy-image]
    paths: [image_worker/**, .github/workflows/image-worker.yml]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space (the PyTorch base image is large)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: image_worker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/randyharrogates/ledgerlens-flux:${{ github.sha }}
            ghcr.io/randyharrogates/ledgerlens-flux:latest
          labels: org.opencontainers.image.source=https://github.com/randyharrogates/runpod-ledgerlens
